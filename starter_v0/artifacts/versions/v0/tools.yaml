# starter_v0 — intentionally incomplete first-draft declarations.
# Students improve routing guidance, argument conventions, missing-information
# handling, and confirmation boundaries through v1/v2/v3.
#
# Keep built-in names and supplied evaluation cases unchanged.
# Improve descriptions and compatible schemas. Declare team-built bonus tools
# here and in tools/__init__.py, then test them with team-authored cases.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
  description: "Hỏi lại người dùng để làm rõ thông tin thiếu, xác nhận hành động ghi, hoặc chọn phương án khi thông tin mơ hồ/không hợp lệ."
  parameters:
    type: object
    properties:
      question:
        type: string
        default: ""
        description: "Nội dung câu hỏi ngắn gọn gửi tới người dùng."
      response_type:
        type: string
        enum: [text, yes_no, choice]
        default: "text"
        description: "Loại phản hồi: 'text' khi thiếu thông tin tự do (như mã máy asset_id, mã nhân viên employee_id); 'yes_no' khi cần xác nhận trước hành động ghi (như tạo ticket); 'choice' khi đưa ra danh sách lựa chọn cụ thể (như chọn giữa production và staging khi môi trường mơ hồ)."
      options:
        type: array
        default: []
        items:
          type: string
        description: "Danh sách các lựa chọn khi response_type='choice'. Ví dụ: ['production', 'staging']."
    required: [question, response_type]

  - name: search_kb
    description: "Tìm hướng dẫn hỗ trợ kỹ thuật."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        category: {type: string, enum: [all, vpn, email, wifi, printing, account, security, hardware, software, meeting_room], default: "all", description: "Nhóm hướng dẫn"}
        top_k: {type: integer, default: 3, description: "Số kết quả"}
      required: [query]

  - name: check_service_status
    description: "Kiểm tra trạng thái của một dịch vụ dùng chung (vpn, email, sso, wifi, printing) trên một môi trường cụ thể. CHỈ chấp nhận 2 môi trường hợp lệ là 'production' và 'staging'. Nếu người dùng yêu cầu môi trường khác (ví dụ: demo, test, dev, uat...) hoặc không hợp lệ, KHÔNG được gọi tool này mà phải gọi tool clarify với response_type='choice' và options=['production', 'staging']."
    parameters:
      type: object
      properties:
        service:
          type: string
          enum: [vpn, email, sso, wifi, printing]
          description: "Tên dịch vụ dùng chung cần kiểm tra."
        environment:
          type: string
          enum: [production, staging]
          default: "production"
          description: "Môi trường triển khai dịch vụ ('production' hoặc 'staging'). Bắt buộc chỉ định tham số này. Mặc định là 'production' nếu người dùng không nói rõ môi trường. Nếu ở lượt hội thoại trước đã có môi trường, hãy kế thừa môi trường đó."
      required: [service, environment]

  - name: inspect_device
    description: "Kiểm tra thông tin và chẩn đoán thiết bị."
    parameters:
      type: object
      properties:
        asset_id: {type: string, description: "Mã tài sản"}
        check: {type: string, enum: [all, network, vpn, security, hardware, software], default: "all", description: "Nhóm kiểm tra"}
      required: [asset_id]

  - name: lookup_user
    description: "Tra cứu người dùng trong danh bạ hỗ trợ."
    parameters:
      type: object
      properties:
        employee_id: {type: string, description: "Mã nhân viên"}
      required: [employee_id]

  - name: format_incident_report
    description: "Trình bày các kết quả đã có thành báo cáo."
    parameters:
      type: object
      properties:
        findings:
          type: array
          default: []
          description: "Các kết quả đã thu thập"
          items:
            type: object
            properties:
              label: {type: string}
              detail: {type: string}
              source: {type: string}
              status: {type: string}
        template: {type: string, enum: [brief, technical, handoff], default: "brief", description: "Mẫu báo cáo"}
        incident_title: {type: string, default: "IT incident", description: "Tiêu đề"}
      required: [findings, template]

  # ---------------- Optional/advanced tools ----------------
  - name: search_device_info
    description: "Tìm thông tin công khai về một model thiết bị trên web. Chỉ truyền hãng, model và loại thông tin; không truyền asset ID, employee ID hoặc dữ liệu nội bộ."
    parameters:
      type: object
      properties:
        manufacturer: {type: string, description: "Hãng sản xuất công khai, ví dụ Lenovo"}
        model: {type: string, description: "Tên model công khai, ví dụ ThinkPad T14 Gen 4"}
        query_type: {type: string, enum: [specs, drivers, support, compatibility], default: "support", description: "Loại thông tin cần tìm"}
        max_results: {type: integer, default: 3, description: "Số kết quả, tối đa 5"}
      required: [manufacturer, model, query_type]

  - name: policy
    description: "Tìm trong chính sách IT nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        policy_area: {type: string, enum: [all, access_control, data_privacy, external_tools, incident_response, service_operations, ticketing], default: "all", description: "Nhóm chính sách"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: create_ticket
    description: "Tạo một ticket hỗ trợ."
    parameters:
      type: object
      properties:
        summary: {type: string, default: "", description: "Tóm tắt sự cố"}
        priority: {type: string, enum: [low, medium, high, critical], default: "medium", description: "Mức ưu tiên"}
        asset_id: {type: string, default: "", description: "Mã tài sản nếu có"}
        confirmed: {type: boolean, default: false, description: "Đã được người dùng xác nhận"}
      required: [summary]
